<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anil - Software de comunicação operacional</title>
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo">
    <h1>Anil <span>software de comunicação operacional</span></h1>
    <div id="usuario" hidden>
      <span id="usuario-nome"></span>
      <span id="usuario-perfil" class="selo"></span>
      <button id="botao-ocorrencia" type="button" hidden>Registrar ocorrência</button>
      <button id="botao-sair" type="button">Sair</button>
    </div>
  </header>

  <main>
    <section id="tela-login" class="caixa">
      <h2>Entrar</h2>
      <form id="form-login">
        <label>E-mail
          <input id="email" type="email" required autocomplete="username">
        </label>
        <label>Senha
          <input id="senha" type="password" required autocomplete="current-password">
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p id="erro-login" class="erro" hidden></p>
      <div class="demo">
        <p>Acesso de demonstração (dados fictícios)</p>
        <button type="button" data-email="cco@anil.test">Entrar como CCO / Manutenção</button>
        <button type="button" data-email="atendimento@anil.test">Entrar como Atendimento / Comercial</button>
        <button type="button" data-email="cliente_direto@anil.test">Entrar como Cliente (Voo Direto)</button>
        <button type="button" data-email="cliente_conexao@anil.test">Entrar como Cliente (Com Conexão)</button>
      </div>
    </section>

    <section id="tela-painel" hidden>
      <div class="barra">
        <h2 id="titulo-painel"></h2>
        <div id="acoes" hidden>
          <button id="botao-simular" type="button">Simular ocorrência</button>
        </div>
      </div>
      <div id="filtro-setor" class="filtros-setor" role="group" aria-label="Filtrar ocorrências por setor" hidden>
        <button type="button" data-filtro-setor="TODOS" aria-pressed="true">Todos</button>
        <button type="button" data-filtro-setor="ATENDIMENTO_SOLO" aria-pressed="false">Atendimento Solo</button>
        <button type="button" data-filtro-setor="COMERCIAL_MALHA" aria-pressed="false">Comercial / Malha</button>
        <button type="button" data-filtro-setor="MANUTENCAO" aria-pressed="false">Manutenção</button>
      </div>
      <p id="aviso" class="erro" hidden></p>
      <div id="lista"></div>
      <p class="rodape">Atualização automática a cada 3 s · <span id="ultima-atualizacao"></span></p>
    </section>
  </main>

  <dialog id="modal-ocorrencia" aria-labelledby="titulo-modal-ocorrencia">
    <form id="form-ocorrencia">
      <div class="modal-topo">
        <h2 id="titulo-modal-ocorrencia">Registrar ocorrência</h2>
        <button id="botao-fechar-modal" class="botao-secundario" type="button" aria-label="Fechar">Fechar</button>
      </div>
      <div class="form-colunas">
        <label>Voo
          <select id="voo-ocorrencia" required>
            <option value="">Nenhum voo selecionado</option>
            <option value="1">AD1234 · VCP para REC</option>
            <option value="2">AD5678 · REC para FOR</option>
          </select>
        </label>
        <label>Tipo
          <select id="tipo-ocorrencia" required>
            <option value="">Nenhum tipo selecionado</option>
          </select>
        </label>
      </div>
      <label>Detalhe operacional
        <textarea id="detalhe-ocorrencia" required maxlength="1000"></textarea>
      </label>
      <label>Recomendação operacional
        <input id="recomendacao-ocorrencia" type="text" maxlength="500">
      </label>
      <fieldset>
        <legend>Setores responsáveis</legend>
        <label><input type="checkbox" name="setoresDestino" value="MANUTENCAO" checked> Manutenção</label>
        <label><input type="checkbox" name="setoresDestino" value="COMERCIAL_MALHA" checked> Comercial / Malha</label>
        <label><input type="checkbox" name="setoresDestino" value="ATENDIMENTO_SOLO" checked> Atendimento Solo</label>
      </fieldset>
      <button type="submit">Registrar ocorrência</button>
    </form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
